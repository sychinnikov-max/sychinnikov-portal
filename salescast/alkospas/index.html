<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Кабина управленца: проект клиники</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F1; --card:#FFFFFF; --sunk:#F5EFE6;
  --ink:#1C1917; --ink2:#5D554C; --ink3:#8C8177;
  --line:#E8DFD2; --line2:#F0E9DE;
  --acc:#E2452A; --acc-soft:#FCEDE9;
  --ochre:#B9720F; --ochre-soft:#FDF3E2; --ochre-line:#F2DDB4;
  --teal:#12665A; --teal-soft:#E6F0ED;
  --blue:#3B6FD1; --blue-soft:#EAF0FB;
  --danger:#9B2C2C; --danger-soft:#F8EAEA; --danger-line:#E9CFCF;
  --ok:#2F6F4F; --ok-soft:#EAF1EC;
  --sans:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --disp:"Unbounded",var(--sans);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;scroll-behavior:smooth;scroll-padding-top:66px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
a{color:inherit}
header.hd{position:sticky;top:0;z-index:50;background:rgba(251,247,241,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:18px;height:54px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:600;font-size:15px;text-decoration:none;white-space:nowrap}
.brand .mark{width:19px;height:19px;flex:0 0 19px}
.hd nav{display:flex;gap:15px;margin-left:auto;font-size:13.5px;overflow-x:auto}
.hd nav a{color:var(--ink2);text-decoration:none;white-space:nowrap}
.hd nav a:hover{color:var(--acc)}
.hd nav a.back{color:var(--ink3)}

.hero{padding:34px 0 22px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:0 0 10px}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(24px,3.6vw,34px);line-height:1.13;margin:0 0 10px;letter-spacing:-.01em}
.lead{font-size:16px;color:var(--ink2);max-width:80ch;margin:0 0 18px}
.lead b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.stat .n{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.stat .n small{font-size:13px;color:var(--ink3);font-family:var(--mono);font-weight:500;margin-left:4px}
.stat .l{font-size:12.5px;color:var(--ink3);margin-top:4px;line-height:1.35}
.stat.bad{background:var(--danger-soft);border-color:var(--danger-line)} .stat.bad .n{color:var(--danger)}
.stat.warn{background:var(--ochre-soft);border-color:var(--ochre-line)} .stat.warn .n{color:var(--ochre)}
.stat.ok .n{color:var(--ok)}
.fresh{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.6}
.fresh b{color:var(--ink2);font-weight:500}

section{padding:32px 0}
section+section{border-top:1px solid var(--line2)}
h2{font-family:var(--disp);font-weight:600;font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.smeta{font-size:13.5px;color:var(--ink3);margin:0 0 18px;max-width:86ch}
h3{font-family:var(--disp);font-weight:600;font-size:14.5px;margin:0 0 10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.muted{color:var(--ink3)}
.mono{font-family:var(--mono);font-size:12.5px}
.empty{color:var(--ink3);font-size:14px;padding:8px 0}

/* значки статусов */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.02em;padding:2px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.done{background:var(--ok-soft);color:var(--ok);border-color:#CFE0D5}
.badge.work{background:var(--blue-soft);color:var(--blue);border-color:#CBD8F1}
.badge.appr{background:var(--ochre-soft);color:var(--ochre);border-color:var(--ochre-line)}
.badge.none{background:var(--sunk);color:var(--ink3);border-color:var(--line)}
.badge.block{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.badge.late{background:var(--danger);color:#fff;border-color:var(--danger)}
.badge.late::before{background:#fff}
.badge.today{background:var(--acc-soft);color:var(--acc);border-color:#F3C9BF}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}

/* таблицы */
.tbl{width:100%;border-collapse:collapse;font-size:13.8px}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.tbl tr.late td{background:#FDF4F4}
.tbl tr.today td{background:#FEF6F3}
.tbl tr.done td{color:var(--ink3)}
.tbl tr.ph td{background:var(--sunk);font-family:var(--disp);font-size:12.5px;font-weight:600;color:var(--ink2);padding:9px 8px}
.tblwrap{overflow-x:auto}

/* график */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink)}
.legend i.dash{border-top-style:dashed}
.legend i.sw{width:12px;height:12px;border:0;border-radius:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:8px;line-height:1.4;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .08s;z-index:5}
.tip b{font-family:var(--mono);font-weight:500;color:#FDE3DC}
.rate{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.rate .k{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px}
.rate .k b{font-family:var(--disp);font-size:15px;font-weight:600}

/* гант */
.gantt{overflow-x:auto}
.gantt svg{display:block;min-width:900px;width:100%;height:auto}
.gantt text{font-family:var(--sans)}
.gantt .lbl{font-size:12px;fill:var(--ink)}
.gantt .who{font-size:10.5px;fill:var(--ink3);font-family:var(--mono)}
.gantt .ph{font-family:var(--disp);font-size:11px;font-weight:600;fill:var(--ink2)}
.gantt .ax{font-family:var(--mono);font-size:10px;fill:var(--ink3)}
.gantt .row:hover rect.bar{stroke:var(--ink);stroke-width:1.2}

/* фильтры */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:12.8px;color:var(--ink2);font-family:var(--sans)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.prob.on{background:var(--danger);border-color:var(--danger)}

/* команда */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.person{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px}
.person h3{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.person h3 .pill{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:0 0 10px}
.kv .k{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase;align-self:center}
.kv .v b{font-weight:600}
.kv .v .bad{color:var(--danger);font-weight:600}
.kv .v .warn{color:var(--ochre);font-weight:600}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);gap:2px;margin:6px 0 8px}
.bar i{display:block;height:100%}
.bar i.done{background:var(--ok)} .bar i.work{background:var(--blue)} .bar i.late{background:var(--danger)} .bar i.none{background:#D9D0C4}
.holds{margin:0;padding:0;list-style:none;font-size:13.5px}
.holds li{padding:6px 0;border-top:1px solid var(--line2);display:flex;gap:8px;align-items:baseline}
.holds li:first-child{border-top:0}
.holds .t{flex:1}
.holds a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink3)}

/* проверки */
.checks{margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line2);font-size:14px}
.checks li:first-child{border-top:0}
.checks .ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;margin-top:2px}
.checks .ic.ok{background:var(--ok)} .checks .ic.warn{background:var(--ochre)} .checks .ic.bad{background:var(--danger)} .checks .ic.na{background:var(--ink3)}
.checks .t b{display:block;font-weight:600}
.checks .t span{color:var(--ink2);font-size:13.5px}
.checks .t small{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:3px}

/* окна Софии */
.win{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.win .w{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.win .w b{font-family:var(--mono);font-size:12px;display:block;margin-bottom:5px;color:var(--teal)}
.win .w.now{background:var(--teal-soft);border-color:#CBDFDA}
.win .w ul{margin:0;padding-left:16px}

/* клиент */
.cv-note{font-size:13.5px;color:var(--ink2);padding:0 0 0 14px;border-left:2px solid var(--line);margin:0 0 8px}

/* чаты */
.warnbox{background:var(--ochre-soft);border:1px solid var(--ochre-line);border-radius:10px;padding:12px 14px;font-size:14px;margin:0 0 12px}
.grid-cal{display:grid;gap:2px;font-family:var(--mono);font-size:10.5px}
.grid-cal div{padding:4px 3px;text-align:center;background:var(--sunk);border-radius:3px;min-width:34px}
.grid-cal div.h{background:transparent;color:var(--ink3)}
.grid-cal div.on{background:var(--blue-soft);color:var(--blue)}
.grid-cal div.sum{background:var(--card);border:1px solid var(--line);font-weight:500}

footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--ink3);font-size:13.4px}
footer a{color:var(--ink2)}
.err{background:var(--danger-soft);border:1px solid var(--danger-line);border-radius:10px;padding:14px 16px;color:#5C2222;margin:24px 0}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.hd nav{display:none}}
</style>
</head>
<body>
<header class="hd">
  <div class="wrap">
    <a href="/salescast/" class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none"><path d="M12 1.5 22.5 12 12 22.5 1.5 12 12 1.5Z" fill="var(--acc)"/><path d="M10 8.4 16 12l-6 3.6V8.4Z" fill="#fff"/></svg>
      Salescast
    </a>
    <nav>
      <a href="#segodnya">Сегодня</a>
      <a href="#dinamika">Динамика</a>
      <a href="#karta">Карта</a>
      <a href="#komanda">Команда</a>
      <a href="#sofia">Приемка</a>
      <a href="#klient">Клиент видит</a>
      <a href="#proverki">Проверки</a>
      <a href="#chaty">Чаты</a>
      <a href="#vykladka">Выкладка</a>
      <a href="#istoriya">История</a>
      <a class="back" href="/salescast/nastya/">Карта Насти</a>
    </nav>
  </div>
</header>

<div id="app"><div class="wrap"><p class="empty" style="padding:40px 0">Загружаю снимок…</p></div></div>

<script>
/*__INLINE_DATA__*/
(function(){
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['пн','вт','ср','чт','пт','сб','вс'];
const d2 = (iso) => { if (!iso) return ''; const [y,m,d] = iso.split('-'); return d + '.' + m; };
const dwd = (iso) => { if (!iso) return ''; const dt = new Date(iso + 'T00:00:00'); return d2(iso) + ' ' + WD[(dt.getDay()+6)%7]; };
const dayDiff = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 86400000);
const plural = (n, a, b, c) => { n = Math.abs(n); const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return a; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; };
const dn = (n) => n + ' ' + plural(n, 'день', 'дня', 'дней');

function statusClass(w) {
  if (w.done || w.status === 'Готово') return 'done';
  if (w.overdue_days > 0) return 'late';
  if (w.status === 'В работе') return 'work';
  if (w.status === 'На утверждении') return 'appr';
  if (w.status === 'Заблокировано') return 'block';
  return 'none';
}
function statusBadge(w) {
  const c = statusClass(w);
  if (c === 'late') return `<span class="badge late">просрочка ${w.overdue_days} дн.</span> <span class="badge ${w.status === 'В работе' ? 'work' : w.status === 'На утверждении' ? 'appr' : 'none'}">${esc(w.status)}</span>`;
  const lbl = c === 'done' ? 'готово' : esc(w.status);
  return `<span class="badge ${c}">${lbl}</span>${w.due_today ? ' <span class="badge today">срок сегодня</span>' : ''}`;
}
function stat(n, label, cls, small) {
  return `<div class="stat ${cls || ''}"><div class="n">${n}${small ? `<small>${small}</small>` : ''}</div><div class="l">${label}</div></div>`;
}

function render(S) {
  const cal = S.calendar, sm = S.summary, P = S.project;
  const src = S.sources || {};
  const bookMod = src.book && src.book.modified ? new Date(src.book.modified) : null;
  const fmtDT = (d) => d ? `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : '';
  const built = new Date(S.built_at);

  const overdueAll = (sm.works_overdue || 0) + (sm.weeek_overdue || 0);
  const todayAll = (sm.works_today || 0) + (sm.weeek_today || 0);

  let h = `<div class="wrap">
  <div class="hero" id="segodnya">
    <p class="eyebrow">Кабина управленца · только для Андрея</p>
    <h1>${esc(P.name)}</h1>
    <p class="lead">День <b>${cal.day_of_40}</b> из 40 по договору ${esc(P.contract)}. Фаза сейчас: <b>${esc(cal.phase_now)}</b>.
      До дня готовности 02.10: <b>${cal.days_to_prep_end}</b> дн. До старта публикаций 03.10: <b>${cal.days_to_pub_start}</b> дн.
      До среза по просмотрам 15.10: <b>${cal.days_to_cut}</b> дн.</p>
    <div class="stats">
      ${stat(`${sm.works_done}<small>/ ${sm.works_total}</small>`, 'работ готово в листе «План»', sm.works_done ? 'ok' : '')}
      ${stat(sm.works_in_work, 'работ в работе или на утверждении', '')}
      ${stat(overdueAll, 'просрочено: план + Weeek', overdueAll ? 'bad' : 'ok')}
      ${stat(todayAll, 'сроков сегодня: план + Weeek', todayAll ? 'warn' : '')}
      ${stat(`${sm.weeek_done == null ? '?' : sm.weeek_done}<small>/ ${sm.weeek_total == null ? '?' : sm.weeek_total}</small>`, 'подзадач закрыто в Weeek', '')}
      ${stat(cal.prep_rate_needed == null ? '·' : cal.prep_rate_needed, `нужный темп: работ подготовки в рабочий день (осталось ${cal.prep_left} на ${cal.prep_workdays_left} дн.)`, cal.prep_rate_needed > 2 ? 'warn' : '')}
    </div>
    <div class="fresh">Снимок собран <b>${fmtDT(built)}</b> · книга «План клиника» правлена <b>${bookMod ? fmtDT(bookMod) : (src.book && src.book.error ? 'не прочитано' : '?')}</b>${src.book && src.book.modified_by ? ` (${esc(src.book.modified_by)})` : ''} · Weeek прочитан <b>${src.weeek && src.weeek.fetched_at ? fmtDT(new Date(src.weeek.fetched_at)) : 'нет'}</b>${src.weeek && src.weeek.error ? ` · <span style="color:var(--danger)">${esc(src.weeek.error)}</span>` : ''}${src.sheet && src.sheet.error ? ` · <span style="color:var(--danger)">${esc(src.sheet.error)}</span>` : ''}</div>
  </div>`;

  // ---------------- сегодня и просрочено
  h += `<section><h2>Что горит</h2><p class="smeta">Сроки сегодня и все, что уже просрочено, из обоих источников. Владелец назван так, как стоит в плане.</p>
  <div class="grid2">
    <div class="panel"><h3>Просрочено: ${S.overdue_items.length}</h3>${S.overdue_items.length ? `<table class="tbl"><tr><th>Дн.</th><th>Что</th><th>Кто</th><th>Срок</th></tr>${S.overdue_items.map(x => `<tr class="late"><td class="num">${x.overdue_days}</td><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)} <span class="pill">${esc(x.src)} ${esc(x.n)}</span>${x.status ? ` <span class="badge ${x.status === 'В работе' ? 'work' : x.status === 'На утверждении' ? 'appr' : 'none'}">${esc(x.status)}</span>` : ''}</td><td>${esc(x.who)}</td><td class="num">${dwd(x.due)}</td></tr>`).join('')}</table>` : '<p class="empty">Просрочек нет.</p>'}</div>
    <div class="panel"><h3>Срок сегодня, ${dwd(cal.today)}: ${S.today_items.length}</h3>${S.today_items.length ? `<table class="tbl"><tr><th>Кто</th><th>Что</th></tr>${S.today_items.map(x => `<tr class="today"><td>${esc(x.who)}</td><td>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)} <span class="pill">${esc(x.src)} ${esc(x.n)}</span>${x.status ? ` <span class="badge ${x.status === 'В работе' ? 'work' : x.status === 'На утверждении' ? 'appr' : x.status === 'Готово' ? 'done' : 'none'}">${esc(x.status)}</span>` : ''}</td></tr>`).join('')}</table>` : '<p class="empty">На сегодня сроков нет.</p>'}</div>
  </div></section>`;

  // ---------------- динамика
  h += `<section id="dinamika"><h2>Динамика</h2><p class="smeta">Сколько работ должно быть закрыто по срокам плана к каждому дню и сколько закрыто на самом деле. Факт берется из ежедневных снимков: линия растет с первого снимка, раньше данных нет.</p>
  <div class="panel">${burnupChart(S.burnup, cal.today)}
    <div class="rate">${phaseTiles(S.phases)}</div>
  </div></section>`;

  // ---------------- карта
  h += `<section id="karta"><h2>Дорожная карта: ${sm.works_total} работ по фазам</h2><p class="smeta">Полоса от старта до срока, цвет это статус. Красный хвост после срока показывает, сколько дней работа висит. Вертикальная линия это сегодня.</p>

  <div class="panel"><div class="win">${sf.windows.map(w => `<div class="w ${w.date === cal.today ? 'now' : ''}"><b>${dwd(w.date)}${w.date === cal.today ? ' · сегодня' : ''}</b>${w.items.length ? `<ul>${w.items.map(i => `<li>№ ${i.n} ${esc(i.title)} <span class="badge ${i.status === 'Готово' ? 'done' : i.status === 'В работе' ? 'work' : 'none'}">${esc(i.status)}</span></li>`).join('')}</ul>` : '<span class="muted">по плану ничего</span>'}</div>`).join('')}</div>

    <div class="panel"><h3>Что клиент должен нам</h3><table class="tbl">${(cv.needs || []).map(n => { const late = n.due_iso && n.due_iso < cal.today && n.status !== 'Получено'; return `<tr class="${late ? 'late' : ''}"><td>${esc(n.what)}<br><span class="muted" style="font-size:12.5px">${esc(n.why)}</span></td><td class="num">${esc(n.due)}</td><td><span class="badge ${n.status === 'Ждем от вас' ? 'appr' : 'none'}">${esc(n.status)}</span></td></tr>`; }).join('')}</table>
    <h3 style="margin-top:16px">Что важно знать (как написано клиенту)</h3>${(cv.notes || []).map(n => `<p class="cv-note">${esc(n)}</p>`).join('')}</div>
  </div>`;
  h += `</section>`;

  // ---------------- проверки
  h += `<section id="proverki"><h2>Проверки</h2><p class="smeta">Правила, которые снимок проверяет сам при каждой сборке. Порядок: сначала проблемы.</p>
  <div class="panel"><ul class="checks">${S.checks.map(c => `<li><span class="ic ${c.level}">${c.level === 'ok' ? '✓' : c.level === 'bad' ? '!' : c.level === 'warn' ? '!' : '?'}</span><div class="t"><b>${esc(c.title)}</b><span>${esc(c.detail)}</span><small>источник: ${esc(c.source)}</small></div></li>`).join('')}</ul></div></section>`;

    ${(vk.personas || []).map(p => `<tr><td>${esc(p.persona)}</td><td>${esc(p.theme) || '<span class="muted">не задана</span>'}</td><td>${p.account ? `<a href="${esc(p.account)}" target="_blank" rel="noopener">ссылка</a>` : '<span class="muted">нет</span>'}</td><td class="num">${esc(p.videos)}</td><td class="num">${esc(p.start)}</td><td class="num">${esc(p.end)}</td><td class="num">${esc(p.fact) || '0'}</td><td class="num">${esc(p.views_15) || '·'}</td><td class="num">${esc(p.views_total) || '·'}</td><td><span class="badge ${p.status === 'Готово' ? 'done' : p.status === 'В работе' ? 'work' : 'none'}">${esc(p.status)}</span></td></tr>`).join('')}
    <tr><td colspan="6"><b>Итого выложено</b></td><td class="num"><b>${esc(vk.fact_total) || '0'}</b> из ${P.videos}</td><td colspan="3"></td></tr></table>
    ${vk.grid && vk.grid.dates && vk.grid.dates.length ? `<h3 style="margin-top:16px">Календарная сетка: номер ролика по дням, нагрузка производства</h3><div class="tblwrap"><div class="grid-cal" style="grid-template-columns:110px repeat(${vk.grid.dates.length},1fr)"><div class="h"></div>${vk.grid.dates.map(d => `<div class="h ${d.startsWith(d2(cal.today)) ? 'on' : ''}">${esc(d)}</div>`).join('')}${vk.grid.rows.map(r => `<div class="h" style="text-align:left">${esc(r.name)}</div>${r.cells.map(c => `<div class="${/^Ролик|^Нараст/.test(r.name) ? 'sum' : c ? 'on' : ''}">${esc(c)}</div>`).join('')}`).join('')}</div></div>` : ''}

  // ---------------- история
  h += `<section id="istoriya"><h2>История снимков</h2><p class="smeta">По одной строке на день. Так видно, движется ли что-то между сборками.</p>
  <div class="panel"><div class="tblwrap"><table class="tbl"><tr><th>Дата</th><th>Готово в плане</th><th>В работе</th><th>Просрочено в плане</th><th>Закрыто в Weeek</th><th>Просрочено в Weeek</th></tr>
  ${S.history.slice().reverse().map(r => `<tr><td class="num">${dwd(r.date)}</td><td class="num">${r.works_done} / ${r.works_total}</td><td class="num">${r.works_in_work}</td><td class="num">${r.works_overdue}</td><td class="num">${r.weeek_done == null ? '?' : r.weeek_done} / ${r.weeek_total == null ? '?' : r.weeek_total}</td><td class="num">${r.weeek_overdue == null ? '?' : r.weeek_overdue}</td></tr>`).join('')}</table></div></div></section>`;

  h += `</div><footer><div class="wrap">Источники: <a href="${esc(P.sheet_url)}" target="_blank" rel="noopener">книга «План клиника»</a> (читается, не правится) · <a href="${esc(P.weeek_url)}" target="_blank" rel="noopener">Weeek, проект «Управление»</a> · <a href="${esc(P.client_file_url)}" target="_blank" rel="noopener">файл клиента</a>.
  Снимок собирает <span class="mono">.scripts/salescast-dashboard/build.py</span> три раза в день (08:30, 12:30, 17:30) и кладет в хранилище портала за Access. Архив дня: <span class="mono">?d=ГГГГ-ММ-ДД</span>.</div></footer>`;

  $('#app').innerHTML = h;
  worksTable(S.works, S.people.map(p => p.name), cal.today);
  wireChart();
}

// ---------------- фазы
function phaseTiles(phases) {
  return phases.map(p => `<div class="k">${esc(p.name)}: <b>${p.done}</b> из ${p.total}${p.overdue ? `, <span style="color:var(--danger)">просрочено ${p.overdue}</span>` : ''}${p.in_work ? `, в работе ${p.in_work}` : ''} <span class="muted mono">${d2(p.start)}–${d2(p.end)}</span></div>`).join('');
}

// ---------------- график сгорания
function burnupChart(b, today) {
  if (!b || !b.dates || !b.dates.length) return '<p class="empty">Нет данных для графика.</p>';
  const W = 960, H = 300, L = 40, R = 16, T = 14, B = 34;
  const n = b.dates.length, max = Math.max(b.total || 1, 1);
  const x = (i) => L + (W - L - R) * i / (n - 1);
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const ti = b.dates.indexOf(today);
  let s = `<div class="legend"><span><i class="dash" style="border-color:var(--blue)"></i>план: работ со сроком не позже дня</span><span><i style="border-color:var(--acc)"></i>факт: работ со статусом «Готово»</span></div>`;
  s += `<div class="chart" id="burnup"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Работы по плану и по факту">`;
  // сетка
  for (let v = 0; v <= max; v += 10) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#EFE8DD" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="#8C8177">${v}</text>`;
  }
  s += `<line x1="${L}" x2="${W - R}" y1="${y(max)}" y2="${y(max)}" stroke="#EFE8DD"/><text x="${L - 6}" y="${y(max) + 3.5}" text-anchor="end" font-size="10" font-family="JetBrains Mono,monospace" fill="#8C8177">${max}</text>`;
  // ось дат: каждые 7 дней плюс ключевые
  const keys = { '2026-10-02': 'готовность', '2026-10-15': 'срез', '2026-10-28': 'конец' };
  const keyIdx = Object.keys(keys).map(k => b.dates.indexOf(k)).filter(i => i >= 0);
  const nearKey = (i) => keyIdx.some(k => Math.abs(k - i) <= 2) || (ti >= 0 && Math.abs(ti - i) <= 2);
  b.dates.forEach((d, i) => {
    const key = keys[d];
    if (key || (i % 7 === 0 && !nearKey(i))) {
      s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="${key ? '#DCCFBC' : '#F3EEE6'}" stroke-width="1" ${key ? 'stroke-dasharray="3 3"' : ''}/>`;
      s += `<text x="${x(i)}" y="${H - B + 14}" text-anchor="middle" font-size="10" font-family="JetBrains Mono,monospace" fill="${key ? '#5D554C' : '#8C8177'}">${d2(d)}</text>`;
      if (key) s += `<text x="${x(i)}" y="${H - B + 26}" text-anchor="middle" font-size="9.5" font-family="Golos Text,sans-serif" fill="#5D554C">${key}</text>`;
    }
  });
  if (ti >= 0) s += `<text x="${x(ti)}" y="${H - B + 14}" text-anchor="middle" font-size="10" font-family="JetBrains Mono,monospace" fill="#E2452A">${d2(b.dates[ti])}</text>`;
  // сегодня
  if (ti >= 0) s += `<line x1="${x(ti)}" x2="${x(ti)}" y1="${T}" y2="${H - B}" stroke="#E2452A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${x(ti) + 4}" y="${T + 10}" font-size="10" font-family="JetBrains Mono,monospace" fill="#E2452A">сегодня</text>`;
  // план
  s += `<path d="${b.planned.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>`;
  // факт
  const pts = b.actual.map((v, i) => v == null ? null : [x(i), y(v), v, i]).filter(Boolean);
  if (pts.length) {
    s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach(p => { s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--acc)" stroke="#fff" stroke-width="2"/>`; });
    const last = pts[pts.length - 1];
    s += `<text x="${(last[0] + 8).toFixed(1)}" y="${(last[1] + 4).toFixed(1)}" font-size="11" font-weight="600" font-family="Golos Text,sans-serif" fill="#1C1917">факт ${last[2]}</text>`;
  }
  if (ti >= 0) {
    s += `<text x="${(x(ti) + 8).toFixed(1)}" y="${(y(b.planned[ti]) - 6).toFixed(1)}" font-size="11" font-family="Golos Text,sans-serif" fill="#1C1917">план ${b.planned[ti]}</text>`;
  }
  s += `<rect id="bu-hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  s += `<line id="bu-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#1C1917" stroke-width="1" opacity="0"/>`;
  s += `</svg><div class="tip" id="bu-tip"></div></div>`;
  window.__BU = { b, L, R, W, T, B, H, n, max };
  return s;
}
function wireChart() {
  const c = window.__BU; if (!c) return;
  const box = document.getElementById('burnup'); const svg = box.querySelector('svg');
  const tip = document.getElementById('bu-tip'); const cross = document.getElementById('bu-cross');
  const x = (i) => c.L + (c.W - c.L - c.R) * i / (c.n - 1);
  svg.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * c.W / r.width;
    let i = Math.round((px - c.L) / (c.W - c.L - c.R) * (c.n - 1)); i = Math.max(0, Math.min(c.n - 1, i));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('opacity', '.35');
    const f = c.b.actual[i];
    tip.innerHTML = `${dwd(c.b.dates[i])}<br>план <b>${c.b.planned[i]}</b>${f == null ? '' : ` · факт <b>${f}</b> · отставание <b>${c.b.planned[i] - f}</b>`}`;
    tip.style.left = (x(i) * r.width / c.W) + 'px'; tip.style.top = (r.height * 0.25) + 'px'; tip.style.opacity = '1';
  });
  svg.addEventListener('mouseleave', () => { tip.style.opacity = '0'; cross.setAttribute('opacity', '0'); });
}

// ---------------- гант
function gantt(works, phases, today) {
  const start = '2026-09-18', end = '2026-11-06';
  const days = dayDiff(end, start);
  const LBL = 330, W = 1180, RH = 20, PH = 24, TOP = 38;
  const KEYS = [['2026-10-02', 'готовность'], ['2026-10-03', 'старт'], ['2026-10-15', 'срез'], ['2026-10-18', 'п.5.5'], ['2026-10-28', 'конец']];
  const nearKey = (iso) => KEYS.some(([k]) => Math.abs(dayDiff(k, iso)) <= 3) || Math.abs(dayDiff(today, iso)) <= 3;
  const x = (iso) => LBL + (W - LBL - 10) * dayDiff(iso, start) / days;
  const rows = [];
  let yy = TOP;
  phases.forEach(p => {
    rows.push({ ph: p, y: yy }); yy += PH;
    works.filter(w => w.phase === p.name).forEach(w => { rows.push({ w, y: yy }); yy += RH; });
  });
  const H = yy + 8;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Дорожная карта">`;
  // недельная сетка
  for (let i = 0; i <= days; i++) {
    const d = new Date(Date.parse(start + 'T00:00:00Z') + i * 86400000);
    const iso = d.toISOString().slice(0, 10);
    const wd = (d.getUTCDay() + 6) % 7;
    if (wd === 5 || wd === 6) s += `<rect x="${x(iso)}" y="${TOP - 4}" width="${(W - LBL - 10) / days}" height="${H - TOP}" fill="#F6F1EA"/>`;
    if (wd === 0) { s += `<line x1="${x(iso)}" x2="${x(iso)}" y1="${TOP - 4}" y2="${H}" stroke="#EADFD0"/>${nearKey(iso) ? '' : `<text class="ax" x="${x(iso) + 3}" y="${TOP - 24}">${d2(iso)}</text>`}`; }
  }
  KEYS.forEach(([iso, l], k) => {
    const row = (l === 'старт' || l === 'п.5.5') ? TOP - 10 : TOP - 24;
    s += `<line x1="${x(iso)}" x2="${x(iso)}" y1="${TOP - 4}" y2="${H}" stroke="#B9A88F" stroke-dasharray="3 3"/><text class="ax" x="${x(iso) + 3}" y="${row}" fill="#5D554C">${d2(iso)} ${l}</text>`;
  });
  rows.forEach(r => {
    if (r.ph) { s += `<rect x="0" y="${r.y}" width="${W}" height="${PH - 2}" fill="#F5EFE6"/><text class="ph" x="8" y="${r.y + 15}">${esc(r.ph.name)} · ${r.ph.done} из ${r.ph.total}${r.ph.overdue ? ` · просрочено ${r.ph.overdue}` : ''}</text>`; return; }
    const w = r.w, c = statusClass(w);
    const fill = { done: '#2F6F4F', work: '#3B6FD1', appr: '#E8B85A', none: '#D9D0C4', block: '#9B2C2C', late: w.status === 'В работе' ? '#3B6FD1' : w.status === 'На утверждении' ? '#E8B85A' : '#D9D0C4' }[c];
    const s0 = w.start || w.due, s1 = w.due || w.start;
    const title = `№ ${w.n} ${w.task} · ${w.who} · ${d2(w.start)}–${d2(w.due)} · ${w.status}${w.overdue_days ? ` · просрочка ${w.overdue_days} дн.` : ''}`;
    s += `<g class="row"><title>${esc(title)}</title>`;
    s += `<text class="lbl" x="8" y="${r.y + 13.5}">${esc(String(w.n).padStart(2, ' '))}. ${esc(w.task.length > 40 ? w.task.slice(0, 39) + '…' : w.task)}</text><text class="who" x="${LBL - 8}" y="${r.y + 13.5}" text-anchor="end">${esc(w.who.length > 12 ? w.who.slice(0, 11) + '…' : w.who)}</text>`;
    if (s0 && s1) {
      const x0 = x(s0), x1 = Math.max(x(s1) + (W - LBL - 10) / days, x0 + 3);
      s += `<rect class="bar" x="${x0.toFixed(1)}" y="${r.y + 4}" width="${(x1 - x0).toFixed(1)}" height="${RH - 8}" rx="3" fill="${fill}" ${c === 'late' ? 'stroke="#9B2C2C" stroke-width="1.5"' : ''}/>`;
      if (w.overdue_days > 0) s += `<rect x="${x1.toFixed(1)}" y="${r.y + 6}" width="${(x(today) - x1).toFixed(1)}" height="${RH - 12}" fill="#9B2C2C" opacity=".85"/><text class="who" x="${(x(today) + 4).toFixed(1)}" y="${r.y + 13.5}" fill="#9B2C2C">+${w.overdue_days}</text>`;
      if (w.due_today) s += `<circle cx="${x1.toFixed(1)}" cy="${r.y + RH / 2}" r="3.5" fill="#E2452A"/>`;
    }
    s += `</g>`;
  });
  s += `<line x1="${x(today)}" x2="${x(today)}" y1="${TOP - 4}" y2="${H}" stroke="#E2452A" stroke-width="1.4"/><text class="ax" x="${x(today) + 3}" y="${TOP - 10}" fill="#E2452A" font-weight="600">сегодня ${d2(today)}</text>`;
  s += `<text class="ax" x="${LBL}" y="${TOP - 24}" text-anchor="end" fill="#8C8177">недели ·</text>`;
  s += `</svg>`;
  return s;
}

// ---------------- таблица работ с фильтрами
function worksTable(works, people, today) {
  const F = { person: null, prob: false };
  const fl = document.getElementById('filters');
  const persons = ['Настя', 'София', 'Ксюша', 'Андрей', 'Кирилл', 'Публикаторы', 'Клиент'].filter(p => works.some(w => w.people.includes(p)));
  fl.innerHTML = `<button class="chip on" data-p="">все</button>` + persons.map(p => `<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join('') + `<button class="chip prob" id="chip-prob">только проблемы</button><span class="muted" style="margin-left:auto" id="count"></span>`;
  const draw = () => {
    let list = works.filter(w => !F.person || w.people.includes(F.person));
    if (F.prob) list = list.filter(w => w.overdue_days > 0 || w.due_today || (w.days_left != null && w.days_left <= 2 && w.status === 'Не начато'));
    const tbl = document.getElementById('works');
    let h = `<tr><th>№</th><th>Работа</th><th>Кто</th><th>Старт</th><th>Срок</th><th>Статус</th><th>Зависит</th><th>Комментарий</th></tr>`;
    let ph = null;
    list.forEach(w => {
      if (w.phase !== ph) { ph = w.phase; h += `<tr class="ph"><td colspan="8">${esc(ph)}</td></tr>`; }
      const cls = w.overdue_days > 0 ? 'late' : w.due_today ? 'today' : w.done ? 'done' : '';
      h += `<tr class="${cls}"><td class="num">${w.n}</td><td>${esc(w.task)}<br><span class="muted" style="font-size:12.3px">${esc(w.done_def)}</span></td><td>${esc(w.who)}</td><td class="num">${dwd(w.start)}</td><td class="num">${dwd(w.due)}${w.days_left != null && w.days_left > 0 && w.days_left <= 7 ? `<br><span class="muted">через ${w.days_left}</span>` : ''}</td><td>${statusBadge(w)}</td><td class="num">${esc(w.depends.join(', '))}</td><td class="muted" style="font-size:12.5px">${esc(w.comment)}</td></tr>`;
    });
    tbl.innerHTML = h;
    document.getElementById('count').textContent = `${list.length} из ${works.length}`;
  };
  fl.addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.id === 'chip-prob') { F.prob = !F.prob; b.classList.toggle('on', F.prob); }
    else { F.person = b.dataset.p || null; fl.querySelectorAll('.chip[data-p]').forEach(c => c.classList.toggle('on', c === b)); }
    draw();
  });
  draw();
}

// ---------------- карточка человека
function personCard(p) {
  const w = p.works, k = p.weeek;
  const tot = Math.max(w.total, 1);
  const late = w.overdue, done = w.done, work = w.in_work, none = Math.max(w.total - done - work - late, 0);
  const seg = (n, cls) => n ? `<i class="${cls}" style="flex:${n}" title="${n}"></i>` : '';
  const slip = (s, n) => s == null ? '<span class="muted">пока нечего мерить</span>' : `<b class="${s > 0 ? 'bad' : ''}">${s > 0 ? '+' : ''}${s} дн.</b> <span class="muted">по ${n}</span>`;
  return `<div class="person"><h3>${esc(p.name)} ${k.in_crm ? '' : '<span class="pill">нет в Weeek</span>'}${w.overdue || k.overdue ? `<span class="pill" style="background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)">просрочено ${w.overdue + k.overdue}</span>` : (w.today + k.today ? `<span class="pill" style="background:var(--acc-soft);color:var(--acc)">сегодня ${w.today + k.today}</span>` : '')}</h3>
    <div class="kv">
      <span class="k">План</span><span class="v"><b>${w.done}</b> из ${w.total} готово · в работе ${w.in_work} · ${w.overdue ? `<span class="bad">просрочено ${w.overdue}</span>` : 'просрочек нет'} · сегодня ${w.today} · на неделе ${w.week}</span>
      <span class="k">сдвиг</span><span class="v">${slip(w.slip_avg, w.slip_n)}</span>
      ${k.total ? `<span class="k">Weeek</span><span class="v"><b>${k.done}</b> из ${k.total} закрыто · ${k.overdue ? `<span class="bad">просрочено ${k.overdue}</span>` : 'просрочек нет'} · сегодня ${k.today} · на неделе ${k.week}</span>
      <span class="k">сдвиг</span><span class="v">${slip(k.slip_avg, k.slip_n)}</span>` : ''}
    </div>
    <div class="bar">${seg(done, 'done')}${seg(work, 'work')}${seg(late, 'late')}${seg(none, 'none')}</div>
    <div class="legend" style="font-size:11.5px;margin-bottom:10px"><span><i class="sw" style="background:var(--ok)"></i>готово ${done}</span><span><i class="sw" style="background:var(--blue)"></i>в работе ${work}</span><span><i class="sw" style="background:var(--danger)"></i>просрочено ${late}</span><span><i class="sw" style="background:#D9D0C4"></i>не начато ${none}</span></div>
    ${p.holds.length ? `<h3 style="font-size:12.5px;margin:6px 0 4px">Держит сейчас</h3><ul class="holds">${p.holds.map(x => `<li><span class="badge ${x.overdue_days ? 'late' : 'today'}">${x.overdue_days ? '+' + x.overdue_days : 'сегодня'}</span><span class="t">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</span><span class="pill">${esc(x.src)} ${esc(x.n)}</span></li>`).join('')}</ul>` : `<p class="empty" style="font-size:13px">Сегодня и просроченного ничего нет.</p>`}
    ${p.next.length ? `<h3 style="font-size:12.5px;margin:10px 0 4px">Дальше по плану</h3><ul class="holds">${p.next.map(x => `<li><span class="pill">${dwd(x.due)}</span><span class="t">№ ${x.n} ${esc(x.title)}</span></li>`).join('')}</ul>` : ''}
  </div>`;
}

// ---------------- загрузка
function fail(msg) { $('#app').innerHTML = `<div class="wrap"><div class="err"><b>Снимок не открылся.</b><br>${esc(msg)}</div></div>`; }
if (window.__SNAPSHOT__) { try { render(window.__SNAPSHOT__); } catch (e) { fail('ошибка отрисовки: ' + e.message); console.error(e); } }
else {
  const d = new URLSearchParams(location.search).get('d');
  fetch('/salescast/api/alkospas' + (d ? '?d=' + encodeURIComponent(d) : ''), { credentials: 'same-origin', cache: 'no-store' })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error ? j.error + (j.hint ? '. ' + j.hint : '') : 'ответ ' + r.status); return j; })
    .then((S) => { try { render(S); } catch (e) { fail('ошибка отрисовки: ' + e.message); console.error(e); } })
    .catch((e) => fail(e.message));
}
})();
</script>
