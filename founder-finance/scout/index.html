<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14100C">
<title>Скаут</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314100C'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%23E0B84C' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23FF6B2C'/%3E%3C/svg%3E">
<!--
  Скаут, версия 2 (06.11.2026). Один список вместо трех колонок и графа:
  кому писать, с готовым сообщением и кнопкой «Отправить».

  Данные: карта из KV (/founder-finance/api/scout, собирает .scripts/telegram-scout/run.sh)
  и отметки (/founder-finance/api/scout-outreach). Кнопка «Отправить» ставит заявку
  в KV, отправляет Мак (send.py, launchd раз в минуту) с аккаунта Work. В репозитории
  портала нет ни одного имени: он публичный.
-->
<style>
:root{
  --bg:#14100C; --bg2:#1B1611; --panel:#201A14; --panel2:#261F17;
  --line:#33291F; --line2:#3F3325;
  --ink:#F3EADC; --muted:#AC9B83; --soft:#7A6B57;
  --gold:#E0B84C; --gold-dim:#6E5A20; --fire:#FF6B2C; --green:#4FB47A; --red:#E0604A; --blue:#5C9BDD;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:12px 16px 10px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px;letter-spacing:.01em}
.stamp{font:12px var(--mono);color:var(--soft)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:6px 12px;border-radius:100px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px}
.tab b{font-family:var(--mono);color:var(--ink);margin-left:4px}
.tab.on{border-color:var(--gold-dim);background:#2A2210;color:var(--ink)}
.tab.on b{color:var(--gold)}
.row2{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:100px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--gold-dim);color:var(--ink)}
.search{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--line);border-radius:100px;color:var(--ink);padding:5px 12px;font:inherit;font-size:14px}
.search::placeholder{color:var(--soft)}

.list{margin-top:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;overflow-wrap:anywhere}
.card.hot{border-color:#5B2B12}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{font-weight:700;font-size:16px}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--muted)}
.badge.fire{color:var(--fire);border-color:#5B2B12;background:#2A170D}
.fit{margin-left:auto;font:12px var(--mono);color:var(--soft)}
.fit b{color:var(--gold)}
.meta{color:var(--muted);font-size:14px;margin-top:3px}
.quote{margin-top:10px;padding:8px 12px 0;border-left:3px solid var(--line2);color:var(--ink);font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-height:calc(6em + 8px);cursor:pointer}
.card.hot .quote{border-left-color:var(--fire)}
.quote.open{-webkit-line-clamp:unset;display:block;max-height:none;padding-bottom:8px}
.qsrc{font:12px var(--mono);color:var(--soft);margin-top:4px;padding-left:15px}
.why{font-size:13px;color:var(--soft);margin-top:6px}

.msg{margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
.msg summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:13px;color:var(--muted);display:flex;gap:8px}
.msg summary::-webkit-details-marker{display:none}
.msg summary .pv{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink)}
.msg summary .tg{color:var(--gold);white-space:nowrap}
.msg[open] summary .pv{display:none}
.msg textarea{display:block;width:100%;min-height:260px;resize:vertical;border:none;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:14px/1.5 var(--sans);padding:10px 12px;outline:none}

.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 16px;border-radius:100px;border:1px solid var(--line2);font-size:14px}
.btn.main{background:var(--gold);color:#14100C;border-color:var(--gold);font-weight:700}
.btn.main:disabled{opacity:.5;cursor:default}
.btn.ghost{color:var(--muted)}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.prof{margin-left:auto;font-size:13px}

.st{margin-top:12px;padding:9px 12px;border-radius:10px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st.wait{background:#2A2210;color:var(--gold)}
.st.ok{background:#14261B;color:var(--green)}
.st.rep{background:#122033;color:var(--blue)}
.st.bad{background:#2C1512;color:var(--red)}
.st.mute{background:var(--bg2);color:var(--muted)}
.st .sp{flex:1}
.st .reply{display:block;width:100%;color:var(--ink);white-space:pre-wrap}

.empty{color:var(--soft);text-align:center;padding:40px 0}
.foot{color:var(--soft);font-size:12px;margin-top:28px;line-height:1.6}
.screen{max-width:520px;margin:18vh auto;padding:0 16px;text-align:center}
.screen h2{margin:0 0 8px}
.screen p{color:var(--muted)}
.more{display:block;margin:14px auto 0;color:var(--muted);border:1px solid var(--line);border-radius:100px;padding:8px 18px}
</style>
</head>
<body>
<div id="screen" class="screen"><h2>Загружаю скаут</h2><p>Карта и отметки…</p></div>
<div id="app" class="wrap" hidden>
  <div class="top">
    <div class="head"><h1>Скаут</h1><span class="stamp" id="stamp"></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="row2" id="envs"></div>
  </div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>Показать еще</button>
  <div class="foot">
    Отправка идет с аккаунта Work, не больше 10 новых диалогов в день, в течение минуты после нажатия.
    Пока заявка в очереди, ее можно отменить. Если с человеком уже есть переписка, знакомство не уходит.
    Ответы подхватываются сами, раз в 15 минут.
  </div>
</div>

<script>
var MAP_API = '/founder-finance/api/scout';
var OUT_API = '/founder-finance/api/scout-outreach';
var PAGE = 30;

var DATA = null, PEOPLE = [], OUT = {}, ROOMS = {};
var S = { tab: 'write', env: 'all', q: '', shown: PAGE };
// ?tab=replied — ссылка сразу на вкладку (из утреннего листа)
(function () { var m = /[?&]tab=(\w+)/.exec(location.search); if (m) S.tab = m[1]; })();
var EDITS = {};   // правки черновиков до отправки, по id
var timer = null;

function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function hm(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return '';
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fail(t, x) { $('#screen').innerHTML = '<h2>' + esc(t) + '</h2><p>' + x + '</p>'; }

function getJSON(url) {
  return fetch(url, { credentials: 'include', cache: 'no-store' }).then(function (r) {
    if (r.status === 401) throw new Error('auth');
    if (r.status === 404) throw new Error('empty');
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  });
}
function post(body) {
  return fetch(OUT_API, {
    method: 'POST', credentials: 'include', cache: 'no-store',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
}

// ── группы ──────────────────────────────────────────────────────────────
var BUSY = { queued: 1, sending: 1, sent: 1, failed: 1, closed: 1, exists: 1, manual: 1 };
function out(p) { return OUT[p.id] || null; }
function group(p) {
  var o = out(p);
  if (o) {
    if (o.status === 'replied') return 'replied';
    if (o.status === 'skip') return 'skip';
    if (BUSY[o.status]) return 'work';
  }
  if (p.draft) return 'write';
  if (p.tier === 'b' && !p.competitor) return 'b';
  return null;
}
var TABS = [
  { k: 'write', t: 'Написать' },
  { k: 'work', t: 'Отправлено' },
  { k: 'replied', t: 'Ответили' },
  { k: 'b', t: 'Еще B' },
  { k: 'skip', t: 'Не то' }
];

function visible() {
  var q = S.q.trim().toLowerCase();
  return PEOPLE.filter(function (p) {
    if (group(p) !== S.tab) return false;
    if (S.env !== 'all' && (p.envs || []).indexOf(S.env) === -1) return false;
    if (q) {
      var hay = [p.name, p.username, p.company, p.niche, p.geo, p.quote].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function (a, b) {
    if (S.tab === 'work' || S.tab === 'replied') {
      var oa = out(a) || {}, ob = out(b) || {};
      return (ob.reply_at || ob.sent_at || ob.queued_at || ob.at || '').localeCompare(oa.reply_at || oa.sent_at || oa.queued_at || oa.at || '');
    }
    return (b.hot - a.hot) || (b.fit - a.fit) || (b.last || '').localeCompare(a.last || '');
  });
}

// ── отрисовка ───────────────────────────────────────────────────────────
function renderTop() {
  var n = {};
  PEOPLE.forEach(function (p) {
    var g = group(p);
    if (!g) return;
    if (S.env !== 'all' && (p.envs || []).indexOf(S.env) === -1) return;
    n[g] = (n[g] || 0) + 1;
  });
  $('#tabs').innerHTML = TABS.map(function (t) {
    return '<button class="tab' + (S.tab === t.k ? ' on' : '') + '" data-tab="' + t.k + '">' +
      t.t + '<b>' + (n[t.k] || 0) + '</b></button>';
  }).join('');
  var envs = (DATA.envs || []).map(function (e) { return { k: e.key, t: e.title }; });
  $('#envs').innerHTML = [{ k: 'all', t: 'Все' }].concat(envs).map(function (e) {
    return '<button class="chip' + (S.env === e.k ? ' on' : '') + '" data-env="' + esc(e.k) + '">' + esc(e.t) + '</button>';
  }).join('') + '<input class="search" id="q" placeholder="поиск: имя, ниша, город" value="' + esc(S.q) + '">';
}

function statusHTML(p) {
  var o = out(p);
  if (!o) return '';
  var cancel = '<button class="btn ghost" data-act="cancel" data-id="' + p.id + '">Отменить</button>';
  var retry = p.draft ? '<button class="btn ghost" data-act="send" data-id="' + p.id + '">Повторить</button>' : '';
  switch (o.status) {
    case 'queued':
      return '<div class="st wait"><span class="sp">' + (o.error ? esc(o.error) : 'В очереди, уйдет в течение минуты') + '</span>' + cancel + '</div>';
    case 'sending':
      return '<div class="st wait"><span class="sp">Отправляется…</span></div>';
    case 'sent':
      return '<div class="st ok"><span class="sp">Отправлено ' + hm(o.sent_at || o.at) + '</span></div>';
    case 'replied':
      return '<div class="st rep"><span class="sp">Ответил ' + hm(o.reply_at || o.at) + '</span>' +
        (o.reply ? '<span class="reply">' + esc(o.reply) + '</span>' : '') + '</div>';
    case 'manual':
      return '<div class="st mute"><span class="sp">Написал сам ' + hm(o.at) + '</span><button class="btn ghost" data-act="reset" data-id="' + p.id + '">Снять</button></div>';
    case 'skip':
      return '<div class="st mute"><span class="sp">Не то</span><button class="btn ghost" data-act="reset" data-id="' + p.id + '">Вернуть</button></div>';
    case 'exists':
      return '<div class="st mute"><span class="sp">' + esc(o.error || 'Уже есть переписка, не отправлял') + '</span></div>';
    case 'closed':
      return '<div class="st bad"><span class="sp">' + esc(o.error || 'Закрыт для сообщений') + '</span></div>';
    case 'failed':
      return '<div class="st bad"><span class="sp">Не ушло: ' + esc(o.error || 'ошибка') + '</span>' + retry + '</div>';
  }
  return '';
}

function card(p) {
  var o = out(p);
  var meta = [p.company, p.niche, p.geo, p.scale].filter(Boolean).map(esc).join(' · ');
  var q = p.quote || (p.quotes && p.quotes[0] && p.quotes[0].text) || '';
  var src = (p.quotes || []).filter(function (m) { return p.quote ? m.text.indexOf(p.quote.slice(0, 40)) !== -1 : true; })[0] || (p.quotes || [])[0];
  var h = '<div class="card' + (p.hot ? ' hot' : '') + '" id="c' + p.id + '">';
  h += '<div class="who"><span class="name">' + esc(p.name) + '</span>' +
    (p.hot ? '<span class="badge fire">запрос</span>' : '') +
    (p.neighbor ? '<span class="badge">моя десятка</span>' : '') +
    (p.known ? '<span class="badge">уже общались</span>' : '') +
    '<span class="fit"><b>' + p.fit + '</b> · ' + esc((p.last || '').slice(8, 10) + '.' + (p.last || '').slice(5, 7)) + '</span></div>';
  if (meta) h += '<div class="meta">' + meta + '</div>';
  if (q) {
    h += '<div class="quote" data-act="toggle">' + esc(q) + '</div>';
    if (src) h += '<div class="qsrc">' + esc(src.room || '') + (src.topic ? ' / ' + esc(src.topic) : '') +
      (src.link ? ' · <a href="' + esc(src.link) + '" target="_blank" rel="noopener">в чат ↗</a>' : '') + '</div>';
  }
  if (p.why && !p.draft) h += '<div class="why">' + esc(p.why) + '</div>';

  if (p.draft && (!o || o.status === 'failed')) {
    var txt = EDITS[p.id] != null ? EDITS[p.id] : p.draft;
    h += '<details class="msg"><summary><span class="pv">' + esc(txt.split('\n')[0]) + '</span><span class="tg">текст ▾</span></summary>' +
      '<textarea data-id="' + p.id + '">' + esc(txt) + '</textarea></details>';
  } else if (o && o.text && o.status !== 'skip' && o.status !== 'manual') {
    h += '<details class="msg"><summary><span class="pv">' + esc(o.text.split('\n')[0]) + '</span><span class="tg">что ушло ▾</span></summary>' +
      '<textarea readonly>' + esc(o.text) + '</textarea></details>';
  }

  h += statusHTML(p);
  var profile = p.username ? '<a class="prof" href="https://t.me/' + esc(p.username) + '" target="_blank" rel="noopener">@' + esc(p.username) + ' ↗</a>' : '';
  if (!o) {
    h += '<div class="acts">' +
      (p.draft ? '<button class="btn main" data-act="send" data-id="' + p.id + '">Отправить</button>' : '') +
      '<button class="btn ghost" data-act="manual" data-id="' + p.id + '">Написал сам</button>' +
      '<button class="btn ghost" data-act="skip" data-id="' + p.id + '">Не то</button>' + profile + '</div>';
  } else if (profile) {
    h += '<div class="acts">' + profile + '</div>';
  }
  return h + '</div>';
}

function render() {
  renderTop();
  var all = visible();
  var items = all.slice(0, S.shown);
  $('#list').innerHTML = items.length ? items.map(card).join('') :
    '<div class="empty">' + (S.tab === 'write' ? 'Новых людей с черновиком нет' : 'Пусто') + '</div>';
  $('#more').hidden = all.length <= S.shown;
}

// ── действия ────────────────────────────────────────────────────────────
function byId(id) { for (var i = 0; i < PEOPLE.length; i++) if (String(PEOPLE[i].id) === String(id)) return PEOPLE[i]; return null; }

function act(kind, id, btn) {
  var p = byId(id);
  if (!p) return;
  var body = { id: String(p.id), action: kind, name: p.name, username: p.username };
  if (kind === 'send') {
    body.text = EDITS[p.id] != null ? EDITS[p.id] : p.draft;
    if (!body.text || body.text.trim().length < 20) return;
  }
  if (btn) btn.disabled = true;
  post(body).then(function (j) {
    if (j.item) OUT[p.id] = j.item; else delete OUT[p.id];
    if (j.error && j._status !== 200) alertLine(p, j.error);
    if (kind === 'send' && j.ok) delete EDITS[p.id];
    render();
    schedule();
  }).catch(function () { if (btn) btn.disabled = false; alertLine(p, 'нет связи с порталом'); });
}
function alertLine(p, text) {
  var c = document.getElementById('c' + p.id);
  if (c) c.insertAdjacentHTML('beforeend', '<div class="st bad"><span class="sp">' + esc(text) + '</span></div>');
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab],[data-env],[data-act],#more');
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; S.shown = PAGE; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.env) { S.env = t.dataset.env; S.shown = PAGE; render(); return; }
  if (t.id === 'more') { S.shown += PAGE; render(); return; }
  if (t.dataset.act === 'toggle') { t.classList.toggle('open'); return; }
  act(t.dataset.act, t.dataset.id, t);
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') {
    S.q = e.target.value; S.shown = PAGE;
    var pos = e.target.selectionStart;
    render();
    var q = $('#q'); q.focus(); q.setSelectionRange(pos, pos);
    return;
  }
  if (e.target.tagName === 'TEXTAREA' && e.target.dataset.id) EDITS[e.target.dataset.id] = e.target.value;
});

// ── обновление статусов ─────────────────────────────────────────────────
function pending() {
  for (var k in OUT) if (OUT[k].status === 'queued' || OUT[k].status === 'sending') return true;
  return false;
}
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(refresh, pending() ? 6000 : 60000);
}
function refresh() {
  // Не перерисовываем, пока Андрей правит текст: иначе правка улетит из поля.
  var editing = document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.id === 'q');
  getJSON(OUT_API).then(function (d) {
    var changed = JSON.stringify(d.items || {}) !== JSON.stringify(OUT);
    OUT = d.items || {};
    if (changed && !editing) render();
  }).catch(function () {}).then(schedule);
}

// Пометки старой версии жили в localStorage браузера. Переносим один раз,
// чтобы «написал» и «не то» не потерялись и стали видны на всех устройствах.
function migrate() {
  var old;
  try {
    if (localStorage.getItem('scout.marks.migrated')) return;
    old = JSON.parse(localStorage.getItem('scout.marks') || '{}');
  } catch (e) { return; }
  var jobs = Object.keys(old).filter(function (id) { return !OUT[id] && /^\d+$/.test(id); }).slice(0, 200);
  var chain = Promise.resolve();
  jobs.forEach(function (id) {
    var kind = old[id] === 'no' ? 'skip' : 'manual';
    var p = byId(id) || {};
    chain = chain.then(function () {
      return post({ id: id, action: kind, name: p.name || null, username: p.username || null })
        .then(function (j) { if (j.item) OUT[id] = j.item; });
    });
  });
  chain.then(function () {
    try { localStorage.setItem('scout.marks.migrated', '1'); } catch (e) {}
    if (jobs.length) render();
  });
}

Promise.all([getJSON(MAP_API), getJSON(OUT_API).catch(function () { return { items: {} }; })])
  .then(function (r) {
    DATA = r[0];
    OUT = (r[1] && r[1].items) || {};
    PEOPLE = (DATA.people || []).filter(function (p) { return p.classified; });
    (DATA.rooms || []).forEach(function (x) { ROOMS[x.id] = x; });
    var w = DATA.window || {};
    $('#stamp').textContent = (w.from || '').slice(5).split('-').reverse().join('.') + ' - ' +
      (w.to || '').slice(5).split('-').reverse().join('.') + ' · собран ' + hm(DATA.built_at);
    $('#screen').hidden = true;
    $('#app').hidden = false;
    render();
    migrate();
    schedule();
  })
  .catch(function (e) {
    if (e.message === 'auth') fail('Нужен вход', 'Сессия Cloudflare Access истекла. Обнови страницу.');
    else if (e.message === 'empty') fail('Карта еще не собрана', 'Запусти на Маке <code>.scripts/telegram-scout/run.sh</code>.');
    else fail('Не читается', 'Ошибка: ' + esc(e.message));
  });
</script>
</body>
</html>
