<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Страница не найдена</title>

<style>
  :root{--bg:#131210;--ink:#EDE6D6;--ink-dim:#8A7E6B;--gold:#C2A66A;
        --hair:color-mix(in oklab,var(--ink) 14%,transparent)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;
       justify-content:center;padding:32px;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;line-height:1.6}
  .box{max-width:52ch;text-align:center}
  .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--gold)}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(28px,4vw,40px);
     line-height:1.12;margin:14px 0 12px}
  p{color:var(--ink-dim);font-size:17px}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  a{display:inline-block;font-size:15px;text-decoration:none;color:var(--gold);
    border:1px solid color-mix(in oklab,var(--gold) 32%,transparent);border-radius:4px;padding:12px 20px}
  a:hover{background:color-mix(in oklab,var(--gold) 12%,transparent)}
</style>
</head>

  <div class="box">

    </div>
  </div>
</body>
</html>
