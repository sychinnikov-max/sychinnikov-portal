<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680" role="img">
<title>Миниатюра документа Итог разбора: главная проблема, почему так и первый шаг с ответственным и сроком</title>
<rect x="0" y="0" width="520" height="680" fill="#EAE3D5"/>
<rect x="30" y="30" width="472" height="632" fill="#241F18" fill-opacity="0.05"/>
<rect x="28" y="28" width="472" height="632" fill="#241F18" fill-opacity="0.05"/>
<rect x="26" y="26" width="472" height="632" fill="#241F18" fill-opacity="0.05"/>
<rect x="24" y="24" width="472" height="632" fill="#F4EFE4" stroke="#D8CDBA" stroke-width="1"/>
<text x="52" y="66" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="15" fill="#241F18">Итог разбора, 1 час</text>
<text x="468" y="66" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">25 сентября 2026</text>
<line x1="52" y1="86.5" x2="468" y2="86.5" stroke="#D8CDBA" stroke-width="1"/>
<text x="52" y="116" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">Главная проблема</text>
<rect x="52" y="126" width="416" height="166" fill="#EAE3D5"/>
<rect x="52" y="126" width="3" height="166" fill="#A85338"/>
<text x="68" y="156" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13.5" fill="#241F18">Прибыль растет вдвое медленнее выручки.</text>
<text x="68" y="178" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13.5" fill="#241F18">43 процента прибыли держит одна товарная группа.</text>
<line x1="68" y1="196.5" x2="452" y2="196.5" stroke="#D8CDBA" stroke-width="1"/>
<text x="68" y="212" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">8 месяцев, евро</text>
<text x="294" y="212" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">2026</text>
<text x="376" y="212" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">2025</text>
<text x="452" y="212" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">изменение</text>
<text x="68" y="236" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#241F18">выручка</text>
<text x="294" y="236" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#241F18">650 000</text>
<text x="376" y="236" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6B6257">485 000</text>
<text x="452" y="236" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#4E7A3E">+34%</text>
<text x="68" y="258" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#241F18">прибыль</text>
<text x="294" y="258" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#241F18">124 000</text>
<text x="376" y="258" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#6B6257">106 000</text>
<text x="452" y="258" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#B08A2E">+17%</text>
<text x="68" y="278" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">одна группа дает 53 000 из 124 000, это 43 процента</text>
<text x="52" y="322" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">Почему так</text>
<rect x="52" y="332" width="416" height="118" fill="#EAE3D5"/>
<rect x="52" y="332" width="3" height="118" fill="#9A7328"/>
<text x="68" y="362" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#9A7328">01</text>
<text x="94" y="362" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#241F18">Скидка крупным клиентам выросла с 6 до 11 процентов.</text>
<text x="68" y="398" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#9A7328">02</text>
<text x="94" y="398" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#241F18">Себестоимость группы не пересчитывали с марта 2025.</text>
<text x="68" y="434" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#9A7328">03</text>
<text x="94" y="434" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#241F18">Руководитель продаж не видит остатки на складе.</text>
<text x="52" y="480" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">Первый шаг</text>
<rect x="52" y="490" width="416" height="96" fill="#EAE3D5"/>
<rect x="52" y="490" width="3" height="96" fill="#4E7A3E"/>
<text x="68" y="520" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#241F18">Ввести порог скидки 8 процентов.</text>
<text x="68" y="542" font-family="Manrope, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6B6257">Скидку выше порога согласует собственник.</text>
<text x="68" y="570" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">ответственный: руководитель продаж</text>
<text x="452" y="570" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#4E7A3E">срок 9 октября 2026</text>
<line x1="52" y1="608.5" x2="468" y2="608.5" stroke="#D8CDBA" stroke-width="1"/>
<text x="52" y="630" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#8A8175">компания в примере, данные демонстрационные</text>
</svg>